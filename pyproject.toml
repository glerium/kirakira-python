[project]
name = "kirakira-python"
version = "0.1.0"
description = "KiraKira Codeforces QQ bot for NoneBot2"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "asyncmy>=0.2.14",
    "httpx>=0.28.1",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-tsugu-bangdream-bot>=0.4.6",
    "nonebot2[fastapi]>=2.5.0",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]
